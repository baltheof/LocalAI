<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local AI Assistant</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg:         #0f0f13;
            --sidebar-bg: #13131a;
            --panel-bg:   #1a1a24;
            --border:     #2a2a3a;
            --text:       #c8cfe8;
            --text-muted: #6b7280;
            --accent:     #6c8ef5;
            --accent-dim: #6c8ef520;
            --user-msg:   #1e1e2e;
            --ai-msg:     #16161f;
            --code-bg:    #0c0c12;
            --green:      #4ade80;
            --red:        #f87171;
            --yellow:     #fbbf24;
            --purple:     #a78bfa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ══════════════════════════════════
           SIDEBAR
        ══════════════════════════════════ */
        .sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px 16px;
            gap: 14px;
            flex-shrink: 0;
            transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
        }

        .sidebar.hidden {
            transform: translateX(-100%);
            position: absolute;
            height: 100%;
            z-index: 10;
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border);
        }

        .logo-icon {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, var(--accent), var(--purple));
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; flex-shrink: 0;
        }

        .logo-text { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.1em;
                     color: var(--text-muted); text-transform: uppercase; }

        /* Files */
        .section-label {
            font-size: 0.68rem; font-weight: 600; letter-spacing: 0.1em; 
            color: var(--text-muted); text-transform: uppercase;
        }

        .load-all-btn {
            width: 100%; padding: 9px 12px;
            background: var(--accent-dim); border: 1px solid #6c8ef540;
            color: var(--accent); border-radius: 8px; cursor: pointer;
            font-size: 0.82rem; font-weight: 500; font-family: 'Inter', sans-serif;
            transition: all 0.2s; display: flex; align-items: center;
            justify-content: center; gap: 6px;
        }
        .load-all-btn:hover { background: var(--accent); color: #0f0f13; border-color: var(--accent); }

        .files-list-box {
            flex: 1; overflow-y: auto;
            background: var(--code-bg); border: 1px solid var(--border);
            border-radius: 10px; padding: 6px; min-height: 80px;
        }
        .files-list-box::-webkit-scrollbar { width: 3px; }
        .files-list-box::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .files-empty { padding: 16px; text-align: center; color: var(--text-muted);
                       font-size: 0.78rem; font-style: italic; }

        .file-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 6px 8px; border-radius: 6px; transition: background 0.15s;
        }
        .file-item:hover { background: var(--panel-bg); }

        .file-link {
            color: var(--green); text-decoration: none;
            font-size: 0.8rem; font-weight: 500;
            display: flex; align-items: center; gap: 5px;
        }
        .file-link::before { content: '📄'; font-size: 0.72rem; }
        .file-link:hover { color: #86efac; text-decoration: underline; }

        .delete-btn {
            background: none; border: none; color: var(--text-muted);
            cursor: pointer; font-size: 0.9rem; padding: 2px 4px;
            border-radius: 4px; transition: all 0.15s; line-height: 1;
        }
        .delete-btn:hover { color: var(--red); background: #f8717115; }

        /* History */
        .history-box {
            flex: 1; overflow-y: auto;
            background: var(--code-bg); border: 1px solid var(--border);
            border-radius: 10px; padding: 6px; min-height: 60px;
        }
        .history-box::-webkit-scrollbar { width: 3px; }
        .history-box::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .history-item {
            padding: 5px 8px; border-radius: 5px;
            color: var(--text-muted); font-size: 0.78rem;
            font-style: italic; border-bottom: 1px solid var(--border);
            word-break: break-word;
        }
        .history-item:last-child { border-bottom: none; }

        .clear-btn {
            width: 100%; padding: 9px 12px;
            background: transparent; border: 1px solid var(--border);
            color: var(--text-muted); border-radius: 8px; cursor: pointer;
            font-size: 0.82rem; font-weight: 500; font-family: 'Inter', sans-serif;
            transition: all 0.2s; display: flex; align-items: center;
            justify-content: center; gap: 6px;
        }
        .clear-btn:hover { border-color: var(--red); color: var(--red); background: #f8717110; }

        /* ══════════════════════════════════
           MAIN CHAT
        ══════════════════════════════════ */
        .main-chat {
            flex: 1; display: flex; flex-direction: column;
            min-width: 0; background: var(--bg);
        }

        .chat-header {
            padding: 13px 20px;
            background: var(--sidebar-bg);
            border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }

        .header-left { display: flex; align-items: center; gap: 10px; }

        .menu-btn {
            background: none; border: none; color: var(--text-muted);
            font-size: 1.2rem; cursor: pointer; padding: 5px;
            border-radius: 6px; transition: all 0.15s; line-height: 1;
        }
        .menu-btn:hover { color: var(--text); background: var(--panel-bg); }

        .header-info .title { font-size: 0.9rem; font-weight: 600; }
        .header-info .status {
            font-size: 0.72rem; color: var(--text-muted);
            display: flex; align-items: center; gap: 5px; margin-top: 2px;
        }

        .status-dot {
            width: 6px; height: 6px; background: var(--green);
            border-radius: 50%; box-shadow: 0 0 5px var(--green);
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:0.3} }

        .new-chat-btn {
            background: transparent; border: 1px solid var(--border);
            color: var(--text-muted); padding: 7px 13px;
            border-radius: 7px; cursor: pointer; font-size: 0.82rem;
            font-weight: 500; font-family: 'Inter', sans-serif;
            transition: all 0.2s; display: flex; align-items: center; gap: 5px;
        }
        .new-chat-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

        /* ══════════════════════════════════
           MESSAGES
        ══════════════════════════════════ */
        .chat-history {
            flex: 1; padding: 22px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 14px;
        }
        .chat-history::-webkit-scrollbar { width: 4px; }
        .chat-history::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .message {
            max-width: 78%; padding: 13px 16px; border-radius: 12px;
            line-height: 1.65; word-wrap: break-word; font-size: 0.9rem;
            border: 1px solid var(--border);
            animation: msg-in 0.2s ease;
        }
        @keyframes msg-in { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }

        .user-message {
            background: var(--user-msg); align-self: flex-end;
            border-bottom-right-radius: 3px;
        }
        .ai-message {
            background: var(--ai-msg); align-self: flex-start;
            border-bottom-left-radius: 3px;
        }

        /* Markdown */
        .ai-message p  { margin: 0 0 8px 0; }
        .ai-message p:last-child { margin-bottom: 0; }
        .ai-message strong { color: var(--yellow); font-weight: 600; }
        .ai-message em { color: var(--purple); }

        .ai-message pre {
            background: var(--code-bg); border: 1px solid var(--border);
            border-radius: 8px; padding: 13px 15px;
            overflow-x: auto; margin: 10px 0;
        }
        .ai-message pre code {
            font-family: 'JetBrains Mono', 'Cascadia Code', monospace;
            font-size: 0.83rem; line-height: 1.6;
            background: none; padding: 0; white-space: pre;
        }
        .ai-message code:not(pre code) {
            background: var(--code-bg); color: var(--green);
            padding: 2px 6px; border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.83rem; border: 1px solid var(--border);
        }
        .ai-message ul, .ai-message ol { margin: 6px 0 8px 20px; }
        .ai-message li { margin-bottom: 3px; }

        .source-line {
            margin-top: 10px; padding-top: 8px;
            border-top: 1px solid var(--border);
            color: var(--text-muted); font-size: 0.78rem;
            display: flex; align-items: center; gap: 5px;
        }
        .source-line::before { content: '📎'; font-size: 0.72rem; }

        .voice-badge {
            display: inline-flex; align-items: center; gap: 3px;
            font-size: 0.68rem; background: #fbbf2420;
            color: var(--yellow); border: 1px solid #fbbf2440;
            border-radius: 4px; padding: 1px 6px;
            margin-right: 6px; font-weight: 600;
        }

        /* ══════════════════════════════════
           INPUT AREA
        ══════════════════════════════════ */
        .input-area {
            padding: 14px 20px; background: var(--sidebar-bg);
            border-top: 1px solid var(--border);
            display: flex; gap: 8px; align-items: center;
        }

        .text-input {
            flex: 1; padding: 12px 15px; border-radius: 10px;
            border: 1px solid var(--border); background: var(--code-bg);
            color: var(--text); font-size: 0.9rem;
            font-family: 'Inter', sans-serif; outline: none;
            transition: border-color 0.2s;
        }
        .text-input::placeholder { color: var(--text-muted); }
        .text-input:focus { border-color: var(--accent); }

        .send-btn {
            padding: 12px 18px; background: var(--accent); color: #0f0f13;
            border: none; border-radius: 10px; cursor: pointer;
            font-size: 0.88rem; font-weight: 600;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
            display: flex; align-items: center; gap: 5px;
        }
        .send-btn:hover { background: #8aa4f7; transform: translateY(-1px); }
        .send-btn:active { transform: translateY(0); }

        .mic-btn {
            padding: 12px 13px; background: var(--panel-bg);
            border: 1px solid var(--border); color: var(--text-muted);
            border-radius: 10px; cursor: pointer; font-size: 1rem;
            transition: all 0.2s;
        }
        .mic-btn:hover { border-color: var(--yellow); color: var(--yellow); }
        .mic-btn.listening {
            background: #f8717120; border-color: var(--red); color: var(--red);
            animation: pulse-mic 1s infinite;
        }

        .stop-btn {
            padding: 12px 13px; background: var(--panel-bg);
            border: 1px solid var(--border); color: var(--text-muted);
            border-radius: 10px; cursor: pointer; font-size: 1rem;
            transition: all 0.2s; display: none;
        }
        .stop-btn.visible { display: block; }
        .stop-btn:hover { border-color: var(--red); color: var(--red); background: #f8717110; }     

        @keyframes pulse-mic {
            0%,100%{ box-shadow: 0 0 0 0 #f8717140; }
            50%{ box-shadow: 0 0 0 6px transparent; }
        }

        /* Loading */
        #loading {
            display: none; align-items: center; justify-content: center;
            gap: 8px; padding: 6px 0;
        }
        #loading.visible { display: flex; }

        .dot { width: 5px; height: 5px; background: var(--accent); border-radius: 50%;
               animation: dot-bounce 1.2s infinite; display: inline-block; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dot-bounce {
            0%,80%,100%{ transform:translateY(0); opacity:0.4; }
            40%{ transform:translateY(-5px); opacity:1; }
        }
        .loading-text { color: var(--text-muted); font-size: 0.8rem; }
    </style>
</head>
<body>

<!-- ══ SIDEBAR ══ -->
<div class="sidebar" id="sidebar">
    <div class="sidebar-logo">
        <div class="logo-icon">🤖</div>
        <span class="logo-text">Local AI</span>
    </div>

    <div class="section-label">Φορτωμένα Αρχεία</div>

    <button class="load-all-btn" onclick="sendCommand('διάβασε όλα τα αρχεία')">
        ⬆ Φόρτωση Όλης της Βάσης
    </button>

    <div class="files-list-box" id="loaded-files-list">
        <div class="files-empty">Η μνήμη είναι άδεια.</div>
    </div>

    <button class="clear-btn" onclick="sendCommand('καθάρισε τη μνήμη')">
         Άδειασμα Μνήμης
    </button>


</div>

<!-- ══ MAIN CHAT ══ -->
<div class="main-chat">
    <div class="chat-header">
        <div class="header-left">
            <button class="menu-btn" onclick="toggleSidebar()">☰</button>
            <div class="header-info">
                <div class="title">AI Βοηθός</div>
                <div class="status">
                    <span class="status-dot"></span> Συνδεδεμένο
                </div>
            </div>
        </div>
        <button class="new-chat-btn" onclick="startNewChat()">✦ Νέα Συνομιλία</button>
    </div>

    <div class="chat-history" id="chat-history">
        <div class="message ai-message">Γεια σου! Είμαι ο προσωπικός σου AI βοηθός. Πώς μπορώ να βοηθήσω;</div>
    </div>

    <div id="loading">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="loading-text">Το AI σκέφτεται...</span>
    </div>

    <div class="input-area">
    <button class="mic-btn" id="mic-btn" onclick="startVoice()" title="Φωνητική εισαγωγή">🎤</button>
    <input class="text-input" type="text" id="user-input"
           placeholder="Γράψε την ερώτηση ή εντολή σου..."
           onkeypress="handleEnter(event)">
    <button class="stop-btn" id="stop-btn" onclick="stopRequest()" title="Διακοπή">⏹</button>
    <button class="send-btn" onclick="sendText()">Αποστολή ➤</button>
</div>
</div>

<script>
    const chatEl     = document.getElementById('chat-history');
    const inputEl    = document.getElementById('user-input');
    const loadingEl  = document.getElementById('loading');
    const filesEl    = document.getElementById('loaded-files-list');
    const sidebarEl  = document.getElementById('sidebar');
    const micBtn     = document.getElementById('mic-btn');


    marked.setOptions({ breaks: true, gfm: true });

    function toggleSidebar() { sidebarEl.classList.toggle('hidden'); }

    // ── Προσθήκη μηνύματος ──
    function appendMessage(text, sender, isVoice = false) {
        const div = document.createElement('div');
        div.className = `message ${sender}-message`;

        if (sender === 'user') {
            if (isVoice) {
                const badge = document.createElement('span');
                badge.className = 'voice-badge';
                badge.textContent = '🎤 Φωνή';
                div.appendChild(badge);
            }
            div.appendChild(document.createTextNode(text));
        } else {
            // Ξεχωρίζουμε τη γραμμή Πηγή για ειδική μορφοποίηση
            const allSources = [...text.matchAll(/Πηγή:\s*.+/gi)];
            const sourceLine = allSources.length
                ? allSources[allSources.length - 1][0]
                : '';
            const mainText = text.replace(/\n?Πηγή:\s*.+/gi, '').trimEnd();

            div.innerHTML = marked.parse(mainText);

            if (sourceLine) {
                const srcDiv = document.createElement('div');
                srcDiv.className = 'source-line';
                srcDiv.textContent = sourceLine;
                div.appendChild(srcDiv);
            }

            div.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
        }

        chatEl.appendChild(div);
        chatEl.scrollTop = chatEl.scrollHeight;
    }

    // ── Λίστα αρχείων ──
    function updateFileList(files) {
        filesEl.innerHTML = '';
        if (files.length === 0) {
            filesEl.innerHTML = '<div class="files-empty">Η μνήμη είναι άδεια.</div>';
            return;
        }
        files.forEach(file => {
            const item = document.createElement('div');
            item.className = 'file-item';

            const link = document.createElement('a');
            link.href = `/pdf/${file}`;
            link.target = '_blank';
            link.className = 'file-link';
            link.textContent = file;

            const del = document.createElement('button');
            del.innerHTML = '×';
            del.className = 'delete-btn';
            del.title = 'Αφαίρεση';
            del.onclick = () => sendCommand('διέγραψε το αρχείο ' + file);

            item.appendChild(link);
            item.appendChild(del);
            filesEl.appendChild(item);
        });
    }

    // ── Νέα συνομιλία ──
    async function startNewChat() {
        try {
            await fetch('/new_chat', { method: 'POST' });
            chatEl.innerHTML = '<div class="message ai-message">Γεια σου! Η μνήμη καθαρίστηκε. Είμαι έτοιμος για νέα ερωτήματα!</div>';
            
        } catch(e) { console.error(e); }
    }

    // ── Κύρια αποστολή ──
    let currentController = null;
    const stopBtn = document.getElementById('stop-btn');

    function stopRequest() {
        if (currentController) {
            currentController.abort();
            currentController = null;
        }
        loadingEl.classList.remove('visible');
        stopBtn.classList.remove('visible');
        micBtn.classList.remove('listening');
        micBtn.textContent = '🎤';
        appendMessage('Η διαδικασία διακόπηκε.', 'ai');
    }

    async function processRequest(text, isVoice = false) {
        if (!text && !isVoice) return;

        const hidden = ['διέγραψε το αρχείο', 'βγάλε το αρχείο', 'αφαίρεσε το αρχείο', 'καθάρισε τη μνήμη', 'άδειασε όλα'];
        if (text && !hidden.some(c => text.startsWith(c))) {
            appendMessage(text, 'user', false);
            inputEl.value = '';
        }

        if (isVoice) { micBtn.classList.add('listening'); micBtn.textContent = '⏹'; }
        loadingEl.classList.add('visible');
        stopBtn.classList.add('visible');
        currentController = new AbortController();

        try {
            const res = await fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text, is_voice: isVoice }),
                signal: currentController.signal
            });
            const data = await res.json();

            if (data.user_text_from_voice)
                appendMessage(data.user_text_from_voice, 'user', true);

            if (!text || !hidden.some(c => text.startsWith(c)))
                appendMessage(data.reply, 'ai');

            updateFileList(data.loaded_files);

        } catch(err) {
            if (err.name !== 'AbortError')
                appendMessage('Σφάλμα επικοινωνίας με τον Server.', 'ai');
        } finally {
            loadingEl.classList.remove('visible');
            stopBtn.classList.remove('visible');
            micBtn.classList.remove('listening');
            micBtn.textContent = '🎤';
            currentController = null;
        }
    }

    function sendText()       { processRequest(inputEl.value.trim()); }
    function sendCommand(cmd) { processRequest(cmd); }
    function startVoice()     { processRequest('', true); }
    function handleEnter(e)   { if (e.key === 'Enter') sendText(); }
</script>
</body>
</html>
